# ============================================================================
# AI Advertising Strategy Team - ChatDev 2.0 (DevAll) - GIAI ĐOẠN 1 (đường chính)
# Đặt vào yaml_instance/ rồi chạy:  make validate-yamls  &&  make sync
#
# Thêm vào .env:  MODEL_STRONG=...  MODEL_CHEAP=...  MODEL_REVIEW=...  (tên model/combo trong 9Router)
#                 SERPER_DEV_API_KEY=...  (web_search của ChatDev local dùng Serper)
#
# GHI CHÚ SỬA ĐỔI (rà soát lần 2):
#  - Trường cấu hình đã đối chiếu với schema local: trigger, keep_message, any, none, regex,
#    case_sensitive, max_iterations, reset_on_emit, only_last_message. Python node dùng timeout_seconds.
#  - Điều kiện dùng `regex` (danh sách mẫu, đều neo \A ... \Z): xác nhận định dạng danh sách và việc
#    case_sensitive áp cho regex trong entity/configs/edge/edge_condition.py.
#  - GIAI ĐOẠN 1: (a) clear_context bật ở 3 cạnh Plan_Assembler -> Strategy_QA / Client_Review / Delivery_Packager
#    (cạnh Plan_Gate -> Client_Review và Strategy_QA -> Delivery_Packager để TẮT); (b) Director_Brief có context_window: 8
#    (đặt ở cấp node, cạnh `type`; xác nhận vị trí bằng validate); (c) regex trạng thái neo vào dòng riêng cuối message.
#  - Khối `vars` (5 biến tự tham chiếu) và việc gắn tool CHƯA xử lý trong file này; tự khai báo theo môi trường.
#  - CHƯA chạy toàn luồng trên ChatDev. Ca bắt buộc kiểm thử trên graph: yêu cầu sửa thứ 4 phải tới
#    Blocked_Output mà không gọi thêm Plan_Assembler; lệnh duyệt sai phải ra INVALID_REVIEW_INPUT.
#
# TOOLING gắn trong UI (Advanced settings của node):
#   Director_Brief, Brand_Strategist, Director_Strategy, Media_Planner,
#   Creative_Director, Performance_Analyst : save_file
#   Plan_Assembler               : load_file, save_file
#   Market_Researcher, Competitor_Analyst, Customer_Insight: web_search, read_webpage_content, save_file
#   Evidence_Digest              : load_file, list_directory, save_file
#   Strategy_QA                  : load_file, list_directory, save_file
#   Delivery_Packager            : list_directory, load_file, save_file
# Python node cần: uv add openpyxl python-pptx   (Plan_Gate chỉ dùng thư viện chuẩn)
# Kiểm tra lần chạy đầu: save_file ghi vào đâu? Script đọc artifacts/ và review/ trong code_workspace/.
# ============================================================================
version: 0.4.0
vars:
  BASE_URL: ${BASE_URL}
  API_KEY: ${API_KEY}
  MODEL_STRONG: ${MODEL_STRONG}
  MODEL_CHEAP: ${MODEL_CHEAP}
  MODEL_REVIEW: ${MODEL_REVIEW}
graph:
  id: ad_agency_v2_phase1
  description: 'Giai đoạn 1: đường chính, chưa có vòng sửa, Human hay bàn giao'
  log_level: INFO
  is_majority_voting: false
  initial_instruction: |
    Nhập yêu cầu chiến dịch: sản phẩm, lợi ích, giá và ưu đãi, thị trường, mục tiêu, ngân sách (phân biệt tiền quảng cáo và sản xuất), thời gian, kênh hiện có, landing page, dữ liệu cũ. Thông tin thiếu sẽ được hỏi lại hoặc ghi rõ là giả định.
  start:
  - Campaign_Input
  end:
  - Delivery
  nodes:
  - id: Campaign_Input
    type: passthrough
    config:
      only_last_message: true
  - id: Campaign_Rules
    type: literal
    config:
      role: user
      content: |
        QUY TẮC CHUNG (áp dụng cho mọi node):
        1. Viết bằng tiếng Việt.
        2. Mỗi nhận định quan trọng gắn một nhãn: [TÀI LIỆU] (từ tài liệu người dùng), [NGUỒN NGOÀI] (kèm URL và ngày truy cập), [SUY LUẬN] hoặc [GIẢ THUYẾT] (cần thử nghiệm).
        3. Không bịa CPC, CPA, doanh thu đối thủ hoặc kết quả chiến dịch. Chưa có dữ liệu thì ghi GIẢ ĐỊNH kèm công thức, đơn vị và cơ sở.
        4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.
        5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).
        6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).
        7. Nếu node có dòng quyết định điều phối (BRIEF:, QA:), hãy ghi nó trên MỘT dòng riêng ở cuối cùng của câu trả lời: dòng đó chỉ gồm đúng trạng thái, không có chữ nào khác cùng dòng và không có chữ nào sau nó (được phép in đậm nhẹ). Không viết trạng thái trong câu giải thích như một ví dụ hay lệnh; chỉ ghi MỘT dòng quyết định và không nhắc lại các lựa chọn khác.
        8. Lưu file bằng save_file vào thư mục artifacts/, rồi dán lại đầy đủ nội dung các file đó trong câu trả lời để node sau đọc được.
  - id: Director_Brief
    type: agent
    config:
      provider: openai
      base_url: ${BASE_URL}
      api_key: ${API_KEY}
      name: ${MODEL_STRONG}
      params:
        temperature: 0.2
      role: |
        Bạn là Director, giai đoạn TIẾP NHẬN. Nhận yêu cầu gốc, chuẩn hóa thành campaign_brief.json.
        Các trường: product, benefits[], price, offer, market{region,language}, goal, start_date, end_date, budget{total,currency,ad_spend,production,other}, channels_existing[], landing_page, tracking, past_data, brand_constraints, assumptions[], missing_critical[].
        Định dạng bắt buộc (script kiểm tra sẽ đọc): budget.total, budget.ad_spend, budget.production, budget.other là SỐ thuần, không kèm đơn vị hay dấu phân cách (ad_spend bằng 0 nếu thực sự không có tiền quảng cáo); budget.currency là mã tiền tệ (VND, USD...); start_date và end_date là ngày thật dạng YYYY-MM-DD.
        Mọi thông tin còn thiếu -> dùng giả định hợp lý và ghi rõ trong assumptions và missing_critical.
        Dòng cuối cùng, đúng một dòng: BRIEF: READY
        Lưu artifacts/campaign_brief.json. Trả về JSON brief, và nếu NEED_INFO thì kèm danh sách câu hỏi.

        QUY TẮC CHUNG (áp dụng cho mọi node):
        1. Viết bằng tiếng Việt.
        2. Mỗi nhận định quan trọng gắn một nhãn: [TÀI LIỆU] (từ tài liệu người dùng), [NGUỒN NGOÀI] (kèm URL và ngày truy cập), [SUY LUẬN] hoặc [GIẢ THUYẾT] (cần thử nghiệm).
        3. Không bịa CPC, CPA, doanh thu đối thủ hoặc kết quả chiến dịch. Chưa có dữ liệu thì ghi GIẢ ĐỊNH kèm công thức, đơn vị và cơ sở.
        4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.
        5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).
        6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).
        7. Nếu node có dòng quyết định điều phối (BRIEF:, QA:), hãy ghi nó trên MỘT dòng riêng ở cuối cùng của câu trả lời: dòng đó chỉ gồm đúng trạng thái, không có chữ nào khác cùng dòng và không có chữ nào sau nó (được phép in đậm nhẹ). Không viết trạng thái trong câu giải thích như một ví dụ hay lệnh; chỉ ghi MỘT dòng quyết định và không nhắc lại các lựa chọn khác.
        8. Lưu file bằng save_file vào thư mục artifacts/, rồi dán lại đầy đủ nội dung các file đó trong câu trả lời để node sau đọc được.
  - id: Market_Researcher
    type: agent
    config:
      provider: openai
      base_url: ${BASE_URL}
      api_key: ${API_KEY}
      name: ${MODEL_CHEAP}
      params:
        temperature: 0.2
      role: |
        Bạn là Market Research. Dựa trên campaign_brief.json, nghiên cứu ngành và thị trường: quy mô, xu hướng, mùa vụ, hành vi tìm kiếm và mua, thông điệp phổ biến.
        Dùng web_search và read_webpage_content nếu có. Nếu không có công cụ tìm kiếm, nêu rõ phạm vi chỉ dựa trên tài liệu được cung cấp và đánh dấu mọi nhận định ngoài tài liệu là [GIẢ THUYẾT].
        Cấu trúc market_research.md: Phạm vi và phương pháp; Phát hiện chính (mỗi mục có nhãn và nguồn); Cơ hội và rủi ro; Dữ liệu còn thiếu; bảng Nguồn (STT | URL | Ngày truy cập | Dữ kiện dùng).
        Lưu artifacts/market_research.md.

        QUY TẮC CHUNG (áp dụng cho mọi node):
        1. Viết bằng tiếng Việt.
        2. Mỗi nhận định quan trọng gắn một nhãn: [TÀI LIỆU] (từ tài liệu người dùng), [NGUỒN NGOÀI] (kèm URL và ngày truy cập), [SUY LUẬN] hoặc [GIẢ THUYẾT] (cần thử nghiệm).
        3. Không bịa CPC, CPA, doanh thu đối thủ hoặc kết quả chiến dịch. Chưa có dữ liệu thì ghi GIẢ ĐỊNH kèm công thức, đơn vị và cơ sở.
        4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.
        5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).
        6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).
        7. Nếu node có dòng quyết định điều phối (BRIEF:, QA:), hãy ghi nó trên MỘT dòng riêng ở cuối cùng của câu trả lời: dòng đó chỉ gồm đúng trạng thái, không có chữ nào khác cùng dòng và không có chữ nào sau nó (được phép in đậm nhẹ). Không viết trạng thái trong câu giải thích như một ví dụ hay lệnh; chỉ ghi MỘT dòng quyết định và không nhắc lại các lựa chọn khác.
        8. Lưu file bằng save_file vào thư mục artifacts/, rồi dán lại đầy đủ nội dung các file đó trong câu trả lời để node sau đọc được.
  - id: Competitor_Analyst
    type: agent
    config:
      provider: openai
      base_url: ${BASE_URL}
      api_key: ${API_KEY}
      name: ${MODEL_CHEAP}
      params:
        temperature: 0.2
      role: |
        Bạn là Competitor Analyst. Chọn 3-5 đối thủ trực tiếp hoặc gián tiếp của sản phẩm trong brief.
        Với mỗi đối thủ: định vị, giá và ưu đãi, kênh quảng cáo đang dùng, thông điệp chính, điểm mạnh, điểm yếu (SWOT). Không bịa doanh thu hay chi tiêu quảng cáo.
        Cuối bài: các KHOẢNG TRỐNG cạnh tranh có thể khai thác, và bảng Nguồn (STT | URL | Ngày truy cập | Dữ kiện dùng).
        Dùng web_search và read_webpage_content nếu có; nếu không, đánh dấu [GIẢ THUYẾT].
        Lưu artifacts/competitor_analysis.md.

        QUY TẮC CHUNG (áp dụng cho mọi node):
        1. Viết bằng tiếng Việt.
        2. Mỗi nhận định quan trọng gắn một nhãn: [TÀI LIỆU] (từ tài liệu người dùng), [NGUỒN NGOÀI] (kèm URL và ngày truy cập), [SUY LUẬN] hoặc [GIẢ THUYẾT] (cần thử nghiệm).
        3. Không bịa CPC, CPA, doanh thu đối thủ hoặc kết quả chiến dịch. Chưa có dữ liệu thì ghi GIẢ ĐỊNH kèm công thức, đơn vị và cơ sở.
        4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.
        5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).
        6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).
        7. Nếu node có dòng quyết định điều phối (BRIEF:, QA:), hãy ghi nó trên MỘT dòng riêng ở cuối cùng của câu trả lời: dòng đó chỉ gồm đúng trạng thái, không có chữ nào khác cùng dòng và không có chữ nào sau nó (được phép in đậm nhẹ). Không viết trạng thái trong câu giải thích như một ví dụ hay lệnh; chỉ ghi MỘT dòng quyết định và không nhắc lại các lựa chọn khác.
        8. Lưu file bằng save_file vào thư mục artifacts/, rồi dán lại đầy đủ nội dung các file đó trong câu trả lời để node sau đọc được.
  - id: Customer_Insight
    type: agent
    config:
      provider: openai
      base_url: ${BASE_URL}
      api_key: ${API_KEY}
      name: ${MODEL_CHEAP}
      params:
        temperature: 0.2
      role: |
        Bạn là Customer Insight. Dựa trên brief, dữ liệu khách hàng người dùng cung cấp (nếu có) và nghiên cứu, xác định tối đa 3 phân khúc, đặt ID tạm S1, S2, S3.
        Mỗi phân khúc: nhu cầu, vấn đề, động cơ mua, rào cản, tình huống sử dụng, thông điệp phù hợp và bằng chứng hỗ trợ. Persona chưa được xác minh phải ghi [GIẢ THUYẾT].
        Hành trình mua theo từng phân khúc: nhận biết -> cân nhắc -> mua -> giữ chân.
        Lưu artifacts/audience_segments.json (JSON hợp lệ, mảng phân khúc) và artifacts/customer_journey.md. Có bảng Nguồn ở cuối customer_journey.md.

        QUY TẮC CHUNG (áp dụng cho mọi node):
        1. Viết bằng tiếng Việt.
        2. Mỗi nhận định quan trọng gắn một nhãn: [TÀI LIỆU] (từ tài liệu người dùng), [NGUỒN NGOÀI] (kèm URL và ngày truy cập), [SUY LUẬN] hoặc [GIẢ THUYẾT] (cần thử nghiệm).
        3. Không bịa CPC, CPA, doanh thu đối thủ hoặc kết quả chiến dịch. Chưa có dữ liệu thì ghi GIẢ ĐỊNH kèm công thức, đơn vị và cơ sở.
        4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.
        5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).
        6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).
        7. Nếu node có dòng quyết định điều phối (BRIEF:, QA:), hãy ghi nó trên MỘT dòng riêng ở cuối cùng của câu trả lời: dòng đó chỉ gồm đúng trạng thái, không có chữ nào khác cùng dòng và không có chữ nào sau nó (được phép in đậm nhẹ). Không viết trạng thái trong câu giải thích như một ví dụ hay lệnh; chỉ ghi MỘT dòng quyết định và không nhắc lại các lựa chọn khác.
        8. Lưu file bằng save_file vào thư mục artifacts/, rồi dán lại đầy đủ nội dung các file đó trong câu trả lời để node sau đọc được.
  - id: Evidence_Digest
    type: agent
    config:
      provider: openai
      base_url: ${BASE_URL}
      api_key: ${API_KEY}
      name: ${MODEL_REVIEW}
      params:
        temperature: 0.1
      role: |
        Bạn là Strategy Reviewer ở chế độ TỔNG HỢP BẰNG CHỨNG (Evidence Digest). Bạn nhận báo cáo của Market, Competitor và Customer. Node này tổng hợp và gắn cờ, không chặn luồng.
        Tạo EVIDENCE DIGEST gồm:
        0) BÁO CÁO NHẬN ĐƯỢC: với Market, Competitor, Customer ghi một trạng thái: ĐÃ NHẬN | THIẾU | KHÔNG HỢP LỆ (kèm lý do ngắn). Báo cáo trống, cụt hoặc không đúng vai trò là KHÔNG HỢP LỆ.
        A) Dữ kiện đã có nguồn (tóm tắt, giữ nguồn); với mỗi nguồn ghi rõ ĐÃ ĐỌC (có nội dung truy cập được) hay CHƯA XÁC MINH.
        B) Giả định hoặc giả thuyết chưa có bằng chứng.
        C) Mâu thuẫn giữa các báo cáo.
        D) Khoảng trống dữ liệu cần lưu ý cho giai đoạn chiến lược.
        Không viết lại báo cáo, không bịa nguồn. Nếu không có công cụ truy cập URL, ghi "chưa xác minh truy cập" thay vì khẳng định nguồn đúng.
        Lưu artifacts/evidence_digest.md và artifacts/sources.csv với cột: id,claim,source_url,access_date,scope,evidence_type (document|external|inference|hypothesis). Nếu không có nguồn nào, ghi ít nhất một dòng evidence_type=hypothesis mô tả giới hạn dữ liệu.
        Node này không có dòng quyết định điều phối.

        QUY TẮC CHUNG (áp dụng cho mọi node):
        1. Viết bằng tiếng Việt.
        2. Mỗi nhận định quan trọng gắn một nhãn: [TÀI LIỆU] (từ tài liệu người dùng), [NGUỒN NGOÀI] (kèm URL và ngày truy cập), [SUY LUẬN] hoặc [GIẢ THUYẾT] (cần thử nghiệm).
        3. Không bịa CPC, CPA, doanh thu đối thủ hoặc kết quả chiến dịch. Chưa có dữ liệu thì ghi GIẢ ĐỊNH kèm công thức, đơn vị và cơ sở.
        4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.
        5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).
        6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).
