version: 0.0.0
graph:
  id: ad_agency_v2
  description: 'Bản đầy đủ: Human duyệt brief và kế hoạch, Plan_Gate, vòng sửa 3 lượt, bàn giao có đối chiếu phiên bản'
  log_level: INFO
  is_majority_voting: false
  initial_instruction: |
    Nhập yêu cầu chiến dịch: sản phẩm, lợi ích, giá và ưu đãi, thị trường, mục tiêu, ngân sách (phân biệt tiền quảng cáo và sản xuất), thời gian, kênh hiện có, landing page, dữ liệu cũ. Thông tin thiếu sẽ được hỏi lại hoặc ghi rõ là giả định.
  start:
    - Campaign_Input
  end:
    - Delivery
    - Blocked_Output
  nodes:
    - id: Campaign_Input
      type: passthrough
      config:
        only_last_message: true
    - id: Campaign_Rules
      type: literal
      config:
        role: user
        content: |
          QUY TẮC CHUNG (áp dụng cho mọi node):
          1. Viết bằng tiếng Việt.
          2. Mỗi nhận định quan trọng gắn một nhãn: [TÀI LIỆU] (từ tài liệu người dùng), [NGUỒN NGOÀI] (kèm URL và ngày truy cập), [SUY LUẬN] hoặc [GIẢ THUYẾT] (cần thử nghiệm).
          3. Không bịa CPC, CPA, doanh thu đối thủ hoặc kết quả chiến dịch. Chưa có dữ liệu thì ghi GIẢ ĐỊNH kèm công thức, đơn vị và cơ sở.
          4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.
          5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).
          6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).
          7. Nếu node có dòng quyết định điều phối (BRIEF:, QA:), hãy ghi nó trên MỘT dòng riêng ở cuối cùng của câu trả lời: dòng đó chỉ gồm đúng trạng thái, không có chữ nào khác cùng dòng và không có chữ nào sau nó (được phép in đậm nhẹ). Không viết trạng thái trong câu giải thích như một ví dụ hay lệnh; chỉ ghi MỘT dòng quyết định và không nhắc lại các lựa chọn khác.
          8. Lưu file bằng save_file vào thư mục artifacts/, rồi dán lại đầy đủ nội dung các file đó trong câu trả lời để node sau đọc được.
    - id: Brief_Router
      type: passthrough
      config:
        only_last_message: true
    - id: Review_Router
      type: passthrough
      config:
        only_last_message: true
    - id: QA_Router
      type: passthrough
      config:
        only_last_message: true
    - id: Brief_Clarification
      type: human
      config:
        description: Director cần thêm thông tin để lập brief. Trả lời các câu hỏi ở trên, hoặc nhập 'Không có thêm thông tin, dùng giả định' để tiếp tục.
    - id: Plan_Join
      type: passthrough
      config:
        only_last_message: false
    - id: Plan_Gate_Script
      type: literal
      config:
        role: user
        content: |
          ```python
          import csv, datetime, hashlib, json, pathlib, re, shutil
          from decimal import Decimal, InvalidOperation

          ROUTE_TOKENS = ('[[BRIEF_READY]]', '[[BRIEF_NEED_INFO]]', '[[BRIEF_INVALID]]', '[[QA_PASS]]', '[[QA_REVISE]]', '[[QA_INVALID]]', '[[PLAN_OK]]', '[[PLAN_ISSUES]]', '[[PLAN_ERROR]]', '[[BUILD_OK]]', '[[BUILD_BLOCKED]]', '[[BUILD_ERROR]]', '[[REVIEW_APPROVE]]', '[[REVIEW_REVISE]]', '[[REVIEW_INVALID]]')

          def route_diagnostics(text):
              for token in ROUTE_TOKENS:
                  text = text.replace(token, token.replace("[[", "[ [").replace("]]", "] ]"))
              return text.replace("[[EXEC_FAIL]]", "EXEC_FAIL (diagnostic)").replace("==CODE EXECUTION FAILED==", "CODE EXECUTION FAILED (diagnostic)")


          A, R = pathlib.Path("artifacts"), pathlib.Path("review")
          REVIEW_SET = ['campaign_brief.json', 'market_research.md', 'competitor_analysis.md', 'audience_segments.json', 'customer_journey.md', 'evidence_digest.md', 'sources.csv', 'brand_positioning.md', 'campaign_strategy.md', 'strategy_ids.json', 'media_plan.csv', 'budget_scenarios.csv', 'creative_brief.md', 'creative_matrix.csv', 'measurement_plan.md', 'experiment_plan.csv', 'advertising_strategy_draft.md', 'execution_calendar.csv']
          CSV_COLS = {
              "media_plan.csv": ["channel", "role", "objective", "segment_id", "offer_id", "budget_pct", "budget_amount",
                                 "currency", "start", "end", "landing_page", "assumption"],
              "budget_scenarios.csv": ["scenario", "channel", "budget_amount", "metric", "metric_value", "formula", "assumption"],
              "creative_matrix.csv": ["concept_id", "segment_id", "insight", "hook", "benefit", "proof", "cta", "format",
                                      "asset_requirement", "test_variant"],
              "experiment_plan.csv": ["test_id", "hypothesis", "variant_a", "variant_b", "primary_metric", "min_sample",
                                      "duration_days", "decision_rule"],
              "execution_calendar.csv": ["week", "start", "end", "channel", "activity", "owner", "deliverable"],
              "sources.csv": ["id", "claim", "source_url", "access_date", "scope", "evidence_type"],
          }
          SOURCE_TYPES = {"document", "external", "inference", "hypothesis"}
          errors, issues, info = [], [], {}


          def out(status, **extra):
              d = {"status": status, "errors": errors, "issues": issues, "info": info}
              d.update(extra)
              print(route_diagnostics(json.dumps(d, ensure_ascii=False, indent=2, default=str)))
              print("PLAN: " + status)
              print("[[PLAN_" + status + "]]")


          def num(x):
              # Canonical machine format: dot decimal, no percent/thousands separators.
              text = str(x).strip()
              if len(text) > 100 or not re.fullmatch(r"[+-]?(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)", text):
                  return None
              try:
                  value = Decimal(text)
              except InvalidOperation:
                  return None
              return value if value.is_finite() else None


          def day(x):
              try:
                  text = str(x).strip()
                  if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", text):
                      return None
                  return datetime.date.fromisoformat(text)
              except Exception:
                  return None


          def ids_of(x):
              return [i for i in re.split(r"[;,|/\s]+", str(x or "")) if i]


          def read_json(n):
              try:
                  return json.loads((A / n).read_text(encoding="utf-8-sig"))
              except Exception:
                  return None


          def read_csv(n):
              try:
                  with (A / n).open(encoding="utf-8-sig", newline="") as f:
                      rd = csv.DictReader(f)
                      cols = rd.fieldnames or []
                      rows = [r for r in rd if any(str(v or "").strip() for v in r.values())]
                  return cols, rows
              except Exception:
                  return None, None


          def main():
              for n in REVIEW_SET:
                  p = A / n
                  if not p.is_file() or p.stat().st_size == 0:
                      errors.append("thieu hoac rong: " + n)
              if errors:
                  return out("ERROR")

              brief, ids = read_json("campaign_brief.json"), read_json("strategy_ids.json")
              b = brief.get("budget") if isinstance(brief, dict) else None
              cap = num(b.get("ad_spend")) if isinstance(b, dict) else None
              d0 = day(brief.get("start_date")) if isinstance(brief, dict) else None
              d1 = day(brief.get("end_date")) if isinstance(brief, dict) else None
              cur = str(b.get("currency") or "").strip() if isinstance(b, dict) else ""
              segs, offs = set(), set()
              if isinstance(ids, dict):
                  segs = {s.get("segment_id") for s in (ids.get("segments") or []) if isinstance(s, dict) and s.get("segment_id")}
                  offs = {o.get("offer_id") for o in (ids.get("offers") or []) if isinstance(o, dict) and o.get("offer_id")}
              if cap is None or cap < 0:
                  errors.append("brief: budget.ad_spend thieu hoac khong hop le")
              if not d0 or not d1 or d0 > d1:
                  errors.append("brief: start_date/end_date thieu hoac khong hop le")
              if not cur:
                  errors.append("brief: budget.currency thieu")
              if not segs:
                  errors.append("strategy_ids.json: khong co segments hop le")
              if not offs:
                  errors.append("strategy_ids.json: khong co offers hop le")
              if errors:
                  return out("ERROR")
              info["ad_spend"] = cap

              def table(name):
                  cols, rows = read_csv(name)
                  if cols is None:
                      issues.append(name + ": khong doc duoc dinh dang CSV")
                      return []
                  miss = [c for c in CSV_COLS[name] if c not in cols]
                  if len(cols) != len(set(cols)) or any(None in r or any(v is None for v in r.values()) for r in rows):
                      issues.append(name + ": duplicate columns or malformed row width")
                      return []
                  if miss:
                      issues.append(name + ": thieu cot " + str(miss))
                      return []
                  if not rows:
                      issues.append(name + ": khong co dong du lieu")
                      return []
                  return rows

              def need(name, rows, fields):
                  for i, r in enumerate(rows, 2):
                      for f in fields:
                          if not str(r.get(f) or "").strip():
                              issues.append("%s dong %d: thieu %s" % (name, i, f))

              def in_range(name, i, r):
                  s, e = day(r.get("start")), day(r.get("end"))
                  if not s or not e:
                      issues.append("%s dong %d: ngay khong hop le" % (name, i))
                  elif s > e:
                      issues.append("%s dong %d: start sau end" % (name, i))
                  elif s < d0 or e > d1:
                      issues.append("%s dong %d: ngoai thoi gian chien dich" % (name, i))

              def check_ids(name, i, r, field, valid):
                  got = ids_of(r.get(field))
                  if not got:
                      issues.append("%s dong %d: %s de trong" % (name, i, field))
                  for g in got:
                      if g not in valid:
                          issues.append("%s dong %d: %s '%s' khong co trong strategy_ids.json" % (name, i, field, g))

              # media_plan.csv
              name = "media_plan.csv"
              rows = table(name)
              need(name, rows, ["channel", "role", "objective"])
              tp = ta = Decimal(0)
              for i, r in enumerate(rows, 2):
                  p, a = num(r.get("budget_pct")), num(r.get("budget_amount"))
                  if p is None or a is None or p < 0 or a < 0:
                      issues.append("%s dong %d: budget_pct/budget_amount khong phai so huu han khong am" % (name, i))
                  else:
                      tp += p
                      ta += a
                      if abs(a - p / Decimal(100) * cap) > Decimal("0.02") * max(cap, 1):
                          issues.append("%s dong %d: budget_amount khong khop budget_pct x ad_spend" % (name, i))
                  if str(r.get("currency") or "").strip() != cur:
                      issues.append("%s dong %d: currency khac brief (%s)" % (name, i, cur))
                  in_range(name, i, r)
                  check_ids(name, i, r, "segment_id", segs)
                  check_ids(name, i, r, "offer_id", offs)
              if rows:
                  info["tong_budget_pct"], info["tong_budget_amount"] = round(tp, 2), round(ta, 2)
                  if cap > 0:
                      if abs(tp - 100) > Decimal("0.5"):
                          issues.append("%s: tong budget_pct = %s, phai bang 100" % (name, round(tp, 2)))
                      if ta > cap:
                          issues.append("%s: tong budget_amount %s vuot ad_spend %s" % (name, round(ta, 2), cap))
                      elif abs(ta - cap) / cap > Decimal("0.02"):
                          issues.append("%s: tong budget_amount %s lech hon 2%% so voi ad_spend %s" % (name, round(ta, 2), cap))
                  elif ta > 0:
                      issues.append("%s: ad_spend = 0 nhung co budget_amount > 0" % name)

              # budget_scenarios.csv
              name = "budget_scenarios.csv"
              rows = table(name)
              need(name, rows, ["scenario", "channel", "metric", "assumption"])
              allocations, metrics = {}, set()
              for i, r in enumerate(rows, 2):
                  a, value = num(r.get("budget_amount")), num(r.get("metric_value"))
                  key = (str(r.get("scenario") or "").strip(), str(r.get("channel") or "").strip())
                  metric_key = key + (str(r.get("metric") or "").strip(),)
                  if metric_key in metrics:
                      issues.append("%s dong %d: duplicate scenario/channel/metric" % (name, i))
                  metrics.add(metric_key)
                  estimate_status = str(r.get("estimate_status") or "").strip()
                  if "estimate_status" not in r:
                      estimate_status = "ESTIMATED"
                  if estimate_status == "NOT_ESTIMATED":
                      if str(r.get("metric_value") or "").strip():
                          issues.append("%s dong %d: NOT_ESTIMATED requires an empty metric_value" % (name, i))
                      info.setdefault("unestimated_metrics", []).append({"row": i, "scenario": key[0], "channel": key[1], "metric": metric_key[2], "reason": r.get("assumption")})
                  elif estimate_status == "ESTIMATED":
                      if value is None or value < 0:
                          issues.append("%s dong %d: metric_value must be finite and nonnegative" % (name, i))
                      if not str(r.get("formula") or "").strip():
                          issues.append("%s dong %d: estimated metric requires formula" % (name, i))
                  else:
                      issues.append("%s dong %d: invalid estimate_status" % (name, i))
                  if a is None or a < 0:
                      issues.append("%s dong %d: budget_amount must be finite and nonnegative" % (name, i))
                  elif key in allocations and allocations[key] != a:
                      issues.append("%s dong %d: inconsistent budget for scenario/channel" % (name, i))
                  else:
                      allocations[key] = a
              per = {}
              for (scenario, channel), amount in allocations.items():
                  per[scenario] = per.get(scenario, Decimal(0)) + amount
              for sc, tot in per.items():
                  if tot > cap:
                      issues.append("%s: kich ban '%s' tong %s vuot ad_spend %s" % (name, sc, tot, cap))

              # creative_matrix.csv
              name = "creative_matrix.csv"
              rows = table(name)
              need(name, rows, ["concept_id", "hook", "cta", "proof"])
              for i, r in enumerate(rows, 2):
                  check_ids(name, i, r, "segment_id", segs)

              # experiment_plan.csv
              name = "experiment_plan.csv"
              rows = table(name)
              need(name, rows, ["test_id", "hypothesis", "primary_metric", "min_sample", "decision_rule"])
              for i, r in enumerate(rows, 2):
                  d = num(r.get("duration_days"))
                  sample = num(r.get("min_sample"))
                  if sample is None or sample <= 0 or sample != sample.to_integral_value():
                      issues.append("%s dong %d: min_sample must be a positive integer" % (name, i))
                  if d is None or d <= 0 or d != d.to_integral_value() or d > (d1 - d0).days + 1:
                      issues.append("%s dong %d: duration_days phai la so duong" % (name, i))

              # execution_calendar.csv
              name = "execution_calendar.csv"
              rows = table(name)
              need(name, rows, ["channel", "activity"])
              for i, r in enumerate(rows, 2):
                  w = num(r.get("week"))
                  if w is None or w < 1 or w != w.to_integral_value():
                      issues.append("%s dong %d: week phai la so khong am" % (name, i))
                  in_range(name, i, r)

              # sources.csv
              name = "sources.csv"
              rows = table(name)
              need(name, rows, ["id", "claim"])
              for i, r in enumerate(rows, 2):
                  if str(r.get("evidence_type") or "").strip() not in SOURCE_TYPES:
                      issues.append("%s dong %d: evidence_type khong hop le" % (name, i))

              if read_json("audience_segments.json") is None:
                  issues.append("audience_segments.json: khong phai JSON hop le")

              if issues:
                  return out("ISSUES")

              hashes = {n: hashlib.sha256((A / n).read_bytes()).hexdigest() for n in REVIEW_SET}
              ver = hashlib.sha256("\n".join("%s:%s" % (n, hashes[n]) for n in sorted(hashes)).encode()).hexdigest()[:12]
              R.mkdir(exist_ok=True)
              snapshot = R / ver
              snapshot.mkdir(exist_ok=True)
              for n, digest in hashes.items():
                  dest = snapshot / n
                  if dest.exists() and hashlib.sha256(dest.read_bytes()).hexdigest() != digest:
                      raise ValueError("review snapshot collision: " + n)
                  if not dest.exists():
                      shutil.copyfile(A / n, dest)
                  if hashlib.sha256(dest.read_bytes()).hexdigest() != digest:
                      raise ValueError("source changed while snapshotting: " + n)
              (R / "review_manifest.json").write_text(json.dumps(
                  {"plan_version": ver, "created_at": datetime.datetime.now().isoformat(timespec="seconds"), "files": hashes},
                  ensure_ascii=False, indent=2), encoding="utf-8")
              return out("OK", plan_version=ver)


          try:
              main()
          except Exception as e:
              errors.append("loi script: %s: %s" % (type(e).__name__, e))
              out("ERROR")
          ```
    - id: Plan_Gate
      type: python
      config:
        timeout_seconds: 60
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
    - id: Client_Review
      type: human
      config:
        description: 'Xem bản kế hoạch đã qua QA (kèm plan_version trong thông báo của Plan_Gate). Để DUYỆT: nhập đúng một dòng ''HUMAN: APPROVE'' và không viết gì thêm. Để YÊU CẦU SỬA: bắt đầu bằng ''HUMAN: REVISE'' rồi ghi nội dung cần sửa (bắt buộc có góp ý). Nhập sai cú pháp thì phiên sẽ dừng ở Blocked_Output.'
    - id: Invalid_Review_Notice
      type: literal
      config:
        role: user
        content: |-
          INVALID_REVIEW_INPUT: phản hồi ở bước duyệt không đúng cú pháp nên không có bản nào được bàn giao.
          Cú pháp đúng:
          - Duyệt: một dòng duy nhất 'HUMAN: APPROVE' (không viết thêm).
          - Yêu cầu sửa: bắt đầu bằng 'HUMAN: REVISE' rồi ghi nội dung cần sửa (bắt buộc có góp ý).
          Hãy chạy lại phiên hoặc nhập lại đúng cú pháp ở lần chạy sau.
    - id: Revision_Limit
      type: loop_counter
      config:
        max_iterations: 4
        reset_on_emit: true
        message: 'BLOCKED: đã nhận yêu cầu sửa lần thứ 4 (giới hạn là 3 lượt sửa). Cần xử lý thủ công: xem artifacts/qa_report.json, kết quả Plan_Gate và phản hồi gần nhất.'
    - id: Build_Script
      type: literal
      config:
        role: user
        content: |
          ```python
          import csv, datetime, hashlib, json, math, pathlib, shutil, re
          from decimal import Decimal, InvalidOperation

          ROUTE_TOKENS = ('[[BRIEF_READY]]', '[[BRIEF_NEED_INFO]]', '[[BRIEF_INVALID]]', '[[QA_PASS]]', '[[QA_REVISE]]', '[[QA_INVALID]]', '[[PLAN_OK]]', '[[PLAN_ISSUES]]', '[[PLAN_ERROR]]', '[[BUILD_OK]]', '[[BUILD_BLOCKED]]', '[[BUILD_ERROR]]', '[[REVIEW_APPROVE]]', '[[REVIEW_REVISE]]', '[[REVIEW_INVALID]]')

          def route_diagnostics(text):
              for token in ROUTE_TOKENS:
                  text = text.replace(token, token.replace("[[", "[ [").replace("]]", "] ]"))
              return text.replace("[[EXEC_FAIL]]", "EXEC_FAIL (diagnostic)").replace("==CODE EXECUTION FAILED==", "CODE EXECUTION FAILED (diagnostic)")


          A, R = pathlib.Path("artifacts"), pathlib.Path("review")
          TMP, OUT = pathlib.Path("output_build"), pathlib.Path("output")
          REVIEW_SET = ['campaign_brief.json', 'market_research.md', 'competitor_analysis.md', 'audience_segments.json', 'customer_journey.md', 'evidence_digest.md', 'sources.csv', 'brand_positioning.md', 'campaign_strategy.md', 'strategy_ids.json', 'media_plan.csv', 'budget_scenarios.csv', 'creative_brief.md', 'creative_matrix.csv', 'measurement_plan.md', 'experiment_plan.csv', 'advertising_strategy_draft.md', 'execution_calendar.csv']
          EXTRA = ["qa_report.json", "handoff_notes.md"]
          RENAME = {"advertising_strategy_draft.md": "advertising_strategy.md"}
          SHEETS = [("Media_Plan", "media_plan.csv"), ("Budget_Scenarios", "budget_scenarios.csv"),
                    ("Creative_Matrix", "creative_matrix.csv"), ("Experiments", "experiment_plan.csv"),
                    ("Calendar", "execution_calendar.csv"), ("Sources", "sources.csv")]
          NUMERIC = {"media_plan.csv": {"budget_pct", "budget_amount"},
                     "budget_scenarios.csv": {"budget_amount", "metric_value"},
                     "experiment_plan.csv": {"min_sample", "duration_days"}, "execution_calendar.csv": {"week"}}


          def sha(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()


          def finish(status, problems=None, **extra):
              d = {"status": status, "problems": problems or []}
              d.update(extra)
              print(route_diagnostics(json.dumps(d, ensure_ascii=False, indent=2)))
              print("BUILD: " + status)
              print("[[BUILD_" + status + "]]")


          def num(x):
              # Canonical machine format: dot decimal, no percent/thousands separators.
              text = str(x).strip()
              if len(text) > 100 or not re.fullmatch(r"[+-]?(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)", text):
                  return None
              try:
                  value = Decimal(text)
              except InvalidOperation:
                  return None
              return value if value.is_finite() else None


          def typed(v):
              x = num(v)
              if x is None:
                  raise ValueError("invalid canonical numeric value: " + str(v))
              return int(x) if x == x.to_integral_value() else float(x)


          def verify():
              problems = []
              try:
                  man = json.loads((R / "review_manifest.json").read_text(encoding="utf-8-sig"))
              except Exception as e:
                  return None, None, ["khong doc duoc review/review_manifest.json: %s" % e]
              files = man.get("files", {})
              if set(files) != set(REVIEW_SET):
                  problems.append("danh sach file trong manifest khong khop bo file duoc duyet")
              for n in REVIEW_SET:
                  p = A / n
                  if not p.is_file():
                      problems.append("thieu file: " + n)
                  elif files.get(n) != sha(p):
                      problems.append("file doi sau review (hash lech): " + n)
              ver = hashlib.sha256("\n".join("%s:%s" % (n, files[n]) for n in sorted(files)).encode()).hexdigest()[:12]
              if ver != man.get("plan_version"):
                  problems.append("plan_version trong manifest khong khop hash cac file")
              for n in REVIEW_SET:
                  snapshot = R / ver / n
                  if not snapshot.is_file() or files.get(n) != sha(snapshot):
                      problems.append("missing or changed review snapshot: " + n)
              try:
                  qa = json.loads((A / "qa_report.json").read_text(encoding="utf-8-sig"))
                  if qa.get("verdict") != "PASS":
                      problems.append("qa_report.json: verdict khong phai PASS")
                  if qa.get("plan_version") != man.get("plan_version"):
                      problems.append("qa_report.json: plan_version khac manifest (QA %s, manifest %s)" %
                                      (qa.get("plan_version"), man.get("plan_version")))
              except Exception as e:
                  problems.append("khong doc duoc qa_report.json: %s" % e)
              hn = A / "handoff_notes.md"
              if not hn.is_file() or hn.stat().st_size == 0:
                  problems.append("thieu hoac rong: handoff_notes.md")
              return man, files, problems


          def build(man, files):
              from openpyxl import Workbook
              from pptx import Presentation
              if TMP.exists():
                  shutil.rmtree(TMP)
              TMP.mkdir()
              delivered = []
              for n in REVIEW_SET + EXTRA:
                  dst = RENAME.get(n, n)
                  source = R / man["plan_version"] / n if n in REVIEW_SET else A / n
                  shutil.copyfile(source, TMP / dst)
                  if n in files and sha(TMP / dst) != files[n]:
                      raise ValueError("source changed while copying: " + n)
                  delivered.append({"name": dst, "source": n, "sha256": sha(TMP / dst)})

              wb = Workbook()
              wb.remove(wb.active)
              for sheet, fn in SHEETS:
                  ws = wb.create_sheet(sheet)
                  with (TMP / fn).open(encoding="utf-8-sig", newline="") as f:
                      rd = csv.reader(f)
                      header = next(rd, [])
                      ws.append(header)
                      num_cols = {i for i, h in enumerate(header) if h in NUMERIC.get(fn, set())}
                      for row in rd:
                          values = dict(zip(header, row))
                          unestimated = fn == "budget_scenarios.csv" and values.get("estimate_status", "").strip() == "NOT_ESTIMATED"
                          if unestimated and values.get("metric_value", "").strip():
                              raise ValueError("NOT_ESTIMATED requires an empty metric_value")
                          ws.append([None if unestimated and header[i] == "metric_value" else typed(v) if i in num_cols else v for i, v in enumerate(row)])
              wb.save(TMP / "Campaign_Plan.xlsx")

              md = (TMP / "advertising_strategy.md").read_text(encoding="utf-8-sig")
              parts = md.split("\n## ")
              first = parts[0].strip().splitlines()[0].lstrip("# ").strip() if parts[0].strip() else "Chien luoc quang cao"
              prs = Presentation()
              s = prs.slides.add_slide(prs.slide_layouts[0])
              s.shapes.title.text = first[:80]
              for sec in parts[1:]:
                  head, _, body = sec.partition("\n")
                  s = prs.slides.add_slide(prs.slide_layouts[1])
                  s.shapes.title.text = head.strip()[:80]
                  lines = [l.strip("-*# ").strip() for l in body.splitlines() if l.strip()][:6]
                  s.placeholders[1].text = "\n".join(l[:140] for l in lines)
              prs.save(TMP / "Campaign_Presentation.pptx")

              manifest = {"plan_version": man["plan_version"], "approved_sources": files,
                          "delivered_files": delivered,
                          "generated_files": [{"name": g, "sha256": sha(TMP / g)}
                                              for g in ("Campaign_Plan.xlsx", "Campaign_Presentation.pptx")],
                          "built_at": datetime.datetime.now().isoformat(timespec="seconds")}
              (TMP / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
              if OUT.exists():
                  shutil.rmtree(OUT)
              TMP.rename(OUT)
              return sorted(p.name for p in OUT.iterdir())


          try:
              man, files, problems = verify()
              if problems:
                  finish("BLOCKED", problems)
              else:
                  listing = build(man, files)
                  finish("OK", [], plan_version=man["plan_version"], output_dir=str(OUT), files=listing)
          except Exception as e:
              if TMP.exists():
                  shutil.rmtree(TMP, ignore_errors=True)
              finish("ERROR", ["%s: %s" % (type(e).__name__, e)])
          ```
