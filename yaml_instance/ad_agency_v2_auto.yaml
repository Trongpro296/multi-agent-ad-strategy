        \        'Campaign_Plan.xlsx', 'Campaign_Presentation.pptx',\n        'visit_log_template.csv', 'daily_report_template.csv',\
        \ 'prelaunch_checklist.csv',\n    }\n    findings = []\n    if include_handoff:\n        manifest_path = root.parent\
        \ / 'internal' / 'banner_manifest.json'\n        try:\n            manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))\n\
        \            if manifest.get('status') == 'CREATED':\n                names.add('asset_manifest.json')\n         \
        \       for asset in manifest.get('assets', []):\n                    rel = pathlib.PurePosixPath(asset.get('path',\
        \ ''))\n                    if (not rel.is_absolute() and '..' not in rel.parts and rel.parts\n                  \
        \          and rel.parts[0] == 'banners' and rel.suffix == '.png'):\n                        names.add(str(rel))\n\
        \        except (OSError, ValueError, TypeError, AttributeError):\n            pass  # Build independently checks\
        \ manifest integrity before copying.\n\n    def issue(file, code, message):\n        findings.append({'file': file,\
        \ 'code': code, 'message': message})\n\n    def reference(file, target):\n        target = unquote(target.strip()).split('#',\
        \ 1)[0].split('?', 1)[0]\n        if not target or target.startswith(('http://', 'https://', 'mailto:')):\n      \
        \      return\n        if target not in names:\n            issue(file, 'DELIVERY_REFERENCE', 'Use an existing delivery\
        \ filename, not an internal/unknown path: ' + target)\n\n    files = ['advertising_strategy_draft.md']\n    if include_handoff:\n\
        \        files.append('handoff_notes.md')\n    for file in files:\n        path = root / file\n        if not path.is_file():\n\
        \            continue  # The Gate/Build already handles mandatory missing files.\n        text = path.read_text(encoding='utf-8-sig')\n\
        \        heading = next((line for line in text.splitlines() if line.strip()), '')\n        if re.search(r'bản nháp|\\\
        bdraft\\b|\\brework\\b|chờ\\s+(?:gate|qa|strategy_qa)', heading, re.I):\n            issue(file, 'DELIVERY_TITLE',\
        \ 'Use a neutral client title; review status belongs in handoff/manifest.')\n        if file == 'advertising_strategy_draft.md':\n\
        \            if re.search(r'^\\s*#{1,6}\\s+(?:Bàn giao nhận được|Nhật ký (?:rework|thay đổi))\\s*$', text, re.I |\
        \ re.M) or re.search(r'^\\s*FILE ĐÃ ĐỔI\\s*:', text, re.I | re.M):\n                issue(file, 'INTERNAL_NOTES',\
        \ 'Move handoff receipts and rework history to internal/assembly_notes.md.')\n        # Ignore real web URLs, while\
        \ preserving positions for useful errors.\n        local_text=re.sub(r'https?://[^\\s<>\"`\\[\\]()\\\\]+',lambda m:'\
        \ '*len(m.group()),text,flags=re.I)\n        local_match=re.search(r'artifacts[/\\\\]|code_workspace[/\\\\]|advertising_strategy_draft\\\
        .md|(?<![A-Za-z0-9_])[A-Za-z]:[/\\\\]', local_text)\n        if local_match:\n            issue(file, 'INTERNAL_REFERENCE',\
        \ 'Client documents must refer to delivered filenames, not workspace/draft paths; line %d, matched %r.' % (text.count('\\\
        n',0,local_match.start())+1,local_match.group()))\n        for target in re.findall(r'\\[[^\\]\\n]*\\]\\(<?([^\\s)>]+)>?(?:\\\
        s+\"[^\"]*\")?\\)', text):\n            reference(file, target)\n        for target in re.findall(r'`([^`\\n]+\\.(?:md|csv|json|xlsx|pptx))`',\
        \ text):\n            reference(file, target)\n\n    sources = root / 'sources.csv'\n    if sources.is_file():\n \
        \       try:findings.extend(source_issues_csv(sources.read_bytes()))\n        except OSError:issue('sources.csv','SOURCE_FORMAT','Cannot\
        \ read sources.csv')\n    return findings\n\ndef experiment_issues(artifacts):\n    import csv\n    import datetime\n\
        \    import json\n    import pathlib\n    import re\n    from decimal import Decimal, InvalidOperation\n\n    root\
        \ = pathlib.Path(artifacts)\n    problems = []\n    required = ('test_type', 'sample_unit', 'sample_basis', 'data_source',\n\
        \                'business_kpi', 'decision_supported', 'decision_not_supported',\n                'decision_owner',\
        \ 'prerequisites', 'missing_data_rule', 'start', 'end')\n    try:\n        with (root / 'experiment_plan.csv').open(encoding='utf-8-sig',\
        \ newline='') as f:\n            reader = csv.DictReader(f, strict=True)\n            if not set(required).issubset(reader.fieldnames\
        \ or []):\n                return ['experiment_plan.csv: missing measurement v2 columns; regenerate using the current\
        \ contract']\n            rows = list(reader)\n        brief = json.loads((root / 'campaign_brief.json').read_text(encoding='utf-8-sig'))\n\
        \        campaign_start = datetime.date.fromisoformat(brief['start_date'])\n        campaign_end = datetime.date.fromisoformat(brief['end_date'])\n\
        \    except (OSError, ValueError, KeyError, TypeError, csv.Error):\n        return ['experiment_plan.csv: cannot read\
        \ experiment dates/columns and campaign range']\n    seen = set()\n    for line, row in enumerate(rows, 2):\n    \
        \    prefix = 'experiment_plan.csv row %d: ' % line\n        for field in required:\n            if not str(row.get(field)\
        \ or '').strip():\n                problems.append(prefix + 'missing ' + field)\n        identifier = str(row.get('test_id')\
        \ or '').strip()\n        if not identifier or identifier in seen:\n            problems.append(prefix + 'test_id\
        \ must be nonempty and unique')\n        seen.add(identifier)\n        if row.get('test_type') not in ('TECHNICAL_CHECK',\
        \ 'CREATIVE_EXPLORATION', 'BUSINESS_EVALUATION'):\n            problems.append(prefix + 'invalid test_type')\n   \
        \     if str(row.get('variant_a') or '').strip() == str(row.get('variant_b') or '').strip():\n            problems.append(prefix\
        \ + 'variants must describe different treatments')\n        try:\n            dates = [str(row.get(key) or '') for\
        \ key in ('start', 'end')]\n            if not all(re.fullmatch(r'\\d{4}-\\d{2}-\\d{2}', value) for value in dates):\n\
        \                raise ValueError('ISO dates required')\n            start, end = map(datetime.date.fromisoformat,\
        \ dates)\n            duration = Decimal(str(row.get('duration_days')))\n            if not duration.is_finite() or\
        \ start > end or duration != (end - start).days + 1:\n                raise ValueError('duration mismatch')\n    \
        \        if start < campaign_start or end > campaign_end:\n                raise ValueError('outside campaign')\n\
        \        except (ValueError, InvalidOperation):\n            problems.append(prefix + 'start/end must be inside campaign\
        \ and match duration_days inclusively')\n    return problems\n\ndef route_diagnostics(text):\n    for token in ROUTE_TOKENS:\n\
        \        text = text.replace(token, token.replace(\"[[\", \"[ [\").replace(\"]]\", \"] ]\"))\n    return text.replace(\"\
        [[EXEC_FAIL]]\", \"EXEC_FAIL (diagnostic)\").replace(\"==CODE EXECUTION FAILED==\", \"CODE EXECUTION FAILED (diagnostic)\"\
        )\n\n\nA, R = pathlib.Path(\"artifacts\"), pathlib.Path(\"review\")\nREVIEW_SET = ['campaign_brief.json', 'market_research.md',\
        \ 'competitor_analysis.md', 'audience_segments.json', 'customer_journey.md', 'evidence_digest.md', 'sources.csv',\
        \ 'brand_positioning.md', 'campaign_strategy.md', 'strategy_ids.json', 'media_plan.csv', 'budget_scenarios.csv', 'creative_brief.md',\
        \ 'creative_matrix.csv', 'measurement_plan.md', 'experiment_plan.csv', 'advertising_strategy_draft.md', 'execution_calendar.csv']\n\
        CSV_COLS = {\n    \"media_plan.csv\": [\"channel\", \"role\", \"objective\", \"segment_id\", \"offer_id\", \"budget_pct\"\
        , \"budget_amount\",\n                       \"currency\", \"start\", \"end\", \"landing_page\", \"assumption\"],\n\
        \    \"budget_scenarios.csv\": [\"scenario\", \"channel\", \"budget_amount\", \"metric\", \"metric_value\", \"formula\"\
        , \"assumption\"],\n    \"creative_matrix.csv\": [\"concept_id\", \"segment_id\", \"insight\", \"hook\", \"benefit\"\
        , \"proof\", \"cta\", \"format\",\n                            \"asset_requirement\", \"test_variant\"],\n    \"experiment_plan.csv\"\
        : [\"test_id\", \"hypothesis\", \"variant_a\", \"variant_b\", \"primary_metric\", \"min_sample\",\n              \
        \              \"duration_days\", \"decision_rule\", \"test_type\", \"sample_unit\", \"sample_basis\", \"data_source\"\
        , \"business_kpi\", \"decision_supported\", \"decision_not_supported\", \"decision_owner\", \"prerequisites\", \"\
        missing_data_rule\", \"start\", \"end\"],\n    \"execution_calendar.csv\": [\"week\", \"start\", \"end\", \"channel\"\
        , \"activity\", \"owner\", \"deliverable\"],\n    \"sources.csv\": [\"id\", \"claim\", \"source_url\", \"access_date\"\
        , \"scope\", \"evidence_type\"],\n}\nSOURCE_TYPES = {\"document\", \"external\", \"inference\", \"hypothesis\"}\n\
        errors, issues, info = [], [], {}\n\n\ndef out(status, **extra):\n    d = {\"status\": status, \"errors\": errors,\
        \ \"issues\": issues, \"info\": info}\n    d.update(extra)\n    print(route_diagnostics(json.dumps(d, ensure_ascii=False,\
        \ indent=2, default=str)))\n    print(\"PLAN: \" + status)\n    print(\"[[PLAN_\" + status + \"]]\")\n\n\ndef num(x):\n\
        \    # Canonical machine format: dot decimal, no percent/thousands separators.\n    text = str(x).strip()\n    if\
        \ len(text) > 100 or not re.fullmatch(r\"[+-]?(?:[0-9]+(?:\\.[0-9]+)?|\\.[0-9]+)\", text):\n        return None\n\
        \    try:\n        value = Decimal(text)\n    except InvalidOperation:\n        return None\n    return value if value.is_finite()\
        \ else None\n\n\ndef day(x):\n    try:\n        text = str(x).strip()\n        if not re.fullmatch(r\"[0-9]{4}-[0-9]{2}-[0-9]{2}\"\
        , text):\n            return None\n        return datetime.date.fromisoformat(text)\n    except Exception:\n     \
        \   return None\n\n\ndef ids_of(x):\n    return [i for i in re.split(r\"[;,|/\\s]+\", str(x or \"\")) if i]\n\n\n\
        def read_json(n):\n    try:\n        return json.loads((A / n).read_text(encoding=\"utf-8-sig\"))\n    except Exception:\n\
        \        return None\n\n\ndef read_csv(n):\n    try:\n        with (A / n).open(encoding=\"utf-8-sig\", newline=\"\
        \") as f:\n            rd = csv.DictReader(f)\n            cols = rd.fieldnames or []\n            rows = [r for r\
        \ in rd if any(str(v or \"\").strip() for v in r.values())]\n        return cols, rows\n    except Exception:\n  \
        \      return None, None\n\n\ndef main():\n    for n in REVIEW_SET:\n        p = A / n\n        if not p.is_file()\
        \ or p.stat().st_size == 0:\n            errors.append(\"thieu hoac rong: \" + n)\n    if errors:\n        return\
        \ out(\"ERROR\")\n\n    for finding in delivery_issues(A):\n        target = errors if finding['file'] == 'sources.csv'\
        \ else issues\n        target.append(\"%(file)s [%(code)s]: %(message)s\" % finding)\n    if errors:\n        return\
