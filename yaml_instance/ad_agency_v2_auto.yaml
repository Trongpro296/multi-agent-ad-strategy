        \       p, a = num(r.get(\"budget_pct\")), num(r.get(\"budget_amount\"))\n        if p is None or a is None or p <\
        \ 0 or a < 0:\n            issues.append(\"%s dong %d: budget_pct/budget_amount khong phai so huu han khong am\" %\
        \ (name, i))\n        else:\n            tp += p\n            ta += a\n            if abs(a - p / Decimal(100) * cap)\
        \ > Decimal(\"0.02\") * max(cap, 1):\n                issues.append(\"%s dong %d: budget_amount khong khop budget_pct\
