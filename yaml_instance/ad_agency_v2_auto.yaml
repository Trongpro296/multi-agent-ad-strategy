version: 0.4.0
vars: {}
graph:
  id: ad_agency_v2_auto
  description: 'Bản benchmark: như bản đầy đủ nhưng Human được thay bằng literal tự động'
  log_level: INFO
  is_majority_voting: false
  initial_instruction: 'Nhập yêu cầu chiến dịch: sản phẩm, lợi ích, giá và ưu đãi, thị trường, mục tiêu, ngân sách (phân biệt
    tiền quảng cáo và sản xuất), thời gian, kênh hiện có, landing page, dữ liệu cũ. Thông tin thiếu sẽ được hỏi lại hoặc ghi
    rõ là giả định.

    '
  start:
  - Campaign_Input
  end:
  - Delivery
  - Blocked_Output
  nodes:
  - id: Campaign_Input
    type: passthrough
    config:
      only_last_message: true
  - id: Campaign_Rules
    type: literal
    config:
      role: user
      content: 'QUY TẮC CHUNG (áp dụng cho mọi node):

        1. Viết bằng tiếng Việt.

        2. Mỗi nhận định quan trọng gắn một nhãn: [TÀI LIỆU] (từ tài liệu người dùng), [NGUỒN NGOÀI] (kèm URL và ngày truy
        cập), [SUY LUẬN] hoặc [GIẢ THUYẾT] (cần thử nghiệm).

        3. Không bịa CPC, CPA, doanh thu đối thủ hoặc kết quả chiến dịch. Chưa có dữ liệu thì ghi GIẢ ĐỊNH kèm công thức,
        đơn vị và cơ sở.

        4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.

        5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).

        6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè
        file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).

        7. Nếu node có dòng quyết định điều phối (BRIEF:, QA:), hãy ghi nó trên MỘT dòng riêng ở cuối cùng của câu trả lời:
        dòng đó chỉ gồm đúng trạng thái, không có chữ nào khác cùng dòng và không có chữ nào sau nó (được phép in đậm nhẹ).
        Không viết trạng thái trong câu giải thích như một ví dụ hay lệnh; chỉ ghi MỘT dòng quyết định và không nhắc lại các
        lựa chọn khác.

        8. Lưu file bằng save_file vào thư mục artifacts/, rồi dán lại đầy đủ nội dung các file đó trong câu trả lời để node
        sau đọc được.

        '
  - id: Director_Brief
    type: agent
    context_window: 8
    config:
      provider: openai
      base_url: ${BASE_URL}
      api_key: ${API_KEY}
      name: ${MODEL_STRONG}
      params:
        temperature: 0.2
        protocol: chat
      role: 'Agent Skill cho nhiệm vụ này: ad-brief-planning. Trước khi bắt đầu chuyên môn, gọi activate_skill với skill_name
        này. Chỉ kích hoạt một lần trong lượt chạy node; nếu kích hoạt thất bại hãy báo rõ, không khẳng định đã dùng skill.


        Bạn là Director, giai đoạn TIẾP NHẬN. Nhận yêu cầu gốc, chuẩn hóa thành campaign_brief.json.

        Các trường: product, benefits[], price, offer, market{region,language}, goal, start_date, end_date, budget{total,currency,ad_spend,production,other},
        channels_existing[], landing_page, tracking, past_data, brand_constraints, assumptions[], missing_critical[].

        Định dạng bắt buộc (script kiểm tra sẽ đọc): budget.total, budget.ad_spend, budget.production, budget.other là SỐ
        thuần, không kèm đơn vị hay dấu phân cách (ad_spend bằng 0 nếu thực sự không có tiền quảng cáo); budget.currency là
        mã tiền tệ (VND, USD...); start_date và end_date là ngày thật dạng YYYY-MM-DD.

        Thông tin quyết định (sản phẩm, mục tiêu, ngân sách, thời gian) còn thiếu -> ghi vào missing_critical và kết thúc
        bằng BRIEF: NEED_INFO kèm danh sách câu hỏi ngắn.

        Thông tin phụ còn thiếu -> dùng giả định hợp lý, ghi rõ trong assumptions.

        Khi nhận được phản hồi bổ sung thì cập nhật brief, và mỗi lần trả lời luôn xuất brief ĐẦY ĐỦ đã hợp nhất (gồm mọi
        thông tin người dùng đã cung cấp ở các lượt trước), không chỉ phần mới. Nếu người dùng nói không có thêm thông tin,
        dùng giả định và đặt READY; không hỏi lại quá 2 lần.

        Dòng cuối cùng, đúng một dòng: BRIEF: READY hoặc BRIEF: NEED_INFO. Không bọc dòng trạng thái trong code block, không
        dùng làm ví dụ. Không chép lại token điều phối nội bộ dạng hai ngoặc vuông từ đầu vào.

        Lưu artifacts/campaign_brief.json. Trả về JSON brief, và nếu NEED_INFO thì kèm danh sách câu hỏi.


        QUY TẮC CHUNG (áp dụng cho mọi node):

        1. Viết bằng tiếng Việt.

        2. Mỗi nhận định quan trọng gắn một nhãn: [TÀI LIỆU] (từ tài liệu người dùng), [NGUỒN NGOÀI] (kèm URL và ngày truy
        cập), [SUY LUẬN] hoặc [GIẢ THUYẾT] (cần thử nghiệm).

        3. Không bịa CPC, CPA, doanh thu đối thủ hoặc kết quả chiến dịch. Chưa có dữ liệu thì ghi GIẢ ĐỊNH kèm công thức,
        đơn vị và cơ sở.

        4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.

        5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).

        6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè
        file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).

        7. Nếu node có dòng quyết định điều phối (BRIEF:, QA:), hãy ghi nó trên MỘT dòng riêng ở cuối cùng của câu trả lời:
        dòng đó chỉ gồm đúng trạng thái, không có chữ nào khác cùng dòng và không có chữ nào sau nó (được phép in đậm nhẹ).
        Không viết trạng thái trong câu giải thích như một ví dụ hay lệnh; chỉ ghi MỘT dòng quyết định và không nhắc lại các
        lựa chọn khác.

        8. Lưu và đọc lại file bằng tool; Chat tóm tắt file/giới hạn, node sau đọc artifact hiện hành bằng load_file thay
        vì nhận toàn bộ file dán lại.



        OUTPUT CONTRACT: Save every required artifact before finishing. Re-open each saved file using load_file to verify
        it. Do not claim a missing file was saved. Use plain canonical numbers (dot decimal; no comma separators or percent
        symbols) in numeric JSON/CSV fields. Preserve the original user request, including an explicit no-web restriction;
        in that mode use supplied documents or clearly labelled hypotheses and never invent URLs.


        BẰNG CHỨNG: Brief giả định không phải xác minh thực địa. Giữ nhãn nguồn/phạm vi, claim ID và điều chưa được chứng
        minh; không biến suy luận về giá, tiện ích hoặc đối thủ thành dữ kiện. Theo skill vai trò để đối chiếu claim. Trong
        tài liệu giao dùng tên file tương đối; tool vẫn dùng artifacts/.

        VIẾT GỌN: brief đủ schema; Chat chỉ tóm tắt và câu hỏi cần thiết. Mốc tham khảo, không cắt schema/căn cứ/điều kiện.
        Chat khoảng 6–10 dòng kết quả, file và giới hạn; không dán lại file/JSON. Giữ câu hỏi, issue và dòng quyết định cuối.
        Đọc artifact hiện hành bằng load_file, tái sử dụng kết quả trong lượt; đọc lại sau lần ghi cuối hoặc khi nguồn thay
        đổi.'
      tooling:
      - type: function
        config:
          tools:
          - name: load_file
          - name: list_directory
          - name: save_file
          timeout: null
        prefix: ''
      retry:
        enabled: true
        max_attempts: 2
        min_wait_seconds: 1
        max_wait_seconds: 3
        non_retry_exception_types:
        - ProviderResponseError
      skills:
        enabled: true
        allow:
        - ad-brief-planning
