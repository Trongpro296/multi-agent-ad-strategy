        \ value = num(r.get(\"budget_amount\")), num(r.get(\"metric_value\"))\n        key = (str(r.get(\"scenario\") or \"\
        \").strip(), str(r.get(\"channel\") or \"\").strip())\n        metric_key = key + (str(r.get(\"metric\") or \"\").strip(),)\n\
        \        if metric_key in metrics:\n            issues.append(\"%s dong %d: duplicate scenario/channel/metric\" %\
        \ (name, i))\n        metrics.add(metric_key)\n        estimate_status = str(r.get(\"estimate_status\") or \"\").strip()\n\
        \        if \"estimate_status\" not in r:\n            estimate_status = \"ESTIMATED\"\n        if estimate_status\
        \ == \"NOT_ESTIMATED\":\n            if str(r.get(\"metric_value\") or \"\").strip():\n                issues.append(\"\
        %s dong %d: NOT_ESTIMATED requires an empty metric_value\" % (name, i))\n            info.setdefault(\"unestimated_metrics\"\
        , []).append({\"row\": i, \"scenario\": key[0], \"channel\": key[1], \"metric\": metric_key[2], \"reason\": r.get(\"\
        assumption\")})\n        elif estimate_status == \"ESTIMATED\":\n            if value is None or value < 0:\n    \
        \            issues.append(\"%s dong %d: metric_value must be finite and nonnegative\" % (name, i))\n            if\
        \ not str(r.get(\"formula\") or \"\").strip():\n                issues.append(\"%s dong %d: estimated metric requires\
        \ formula\" % (name, i))\n        else:\n            issues.append(\"%s dong %d: invalid estimate_status\" % (name,\
        \ i))\n        if a is None or a < 0:\n            issues.append(\"%s dong %d: budget_amount must be finite and nonnegative\"\
        \ % (name, i))\n        elif key in allocations and allocations[key] != a:\n            issues.append(\"%s dong %d:\
        \ inconsistent budget for scenario/channel\" % (name, i))\n        else:\n            allocations[key] = a\n    per\
        \ = {}\n    for (scenario, channel), amount in allocations.items():\n        per[scenario] = per.get(scenario, Decimal(0))\
        \ + amount\n    for sc, tot in per.items():\n        if tot > cap:\n            issues.append(\"%s: kich ban '%s'\
        \ tong %s vuot ad_spend %s\" % (name, sc, tot, cap))\n\n    # creative_matrix.csv\n    name = \"creative_matrix.csv\"\
        \n    rows = table(name)\n    need(name, rows, [\"concept_id\", \"hook\", \"cta\", \"proof\"])\n    for i, r in enumerate(rows,\
        \ 2):\n        check_ids(name, i, r, \"segment_id\", segs)\n\n    # experiment_plan.csv\n    name = \"experiment_plan.csv\"\
        \n    rows = table(name)\n    need(name, rows, [\"test_id\", \"hypothesis\", \"primary_metric\", \"min_sample\", \"\
        decision_rule\"])\n    for i, r in enumerate(rows, 2):\n        d = num(r.get(\"duration_days\"))\n        sample\
        \ = num(r.get(\"min_sample\"))\n        if sample is None or sample <= 0 or sample != sample.to_integral_value():\n\
        \            issues.append(\"%s dong %d: min_sample must be a positive integer\" % (name, i))\n        if d is None\
        \ or d <= 0 or d != d.to_integral_value() or d > (d1 - d0).days + 1:\n            issues.append(\"%s dong %d: duration_days\
        \ phai la so duong\" % (name, i))\n\n    # execution_calendar.csv\n    name = \"execution_calendar.csv\"\n    rows\
        \ = table(name)\n    need(name, rows, [\"channel\", \"activity\"])\n    for i, r in enumerate(rows, 2):\n        w\
        \ = num(r.get(\"week\"))\n        if w is None or w < 1 or w != w.to_integral_value():\n            issues.append(\"\
        %s dong %d: week phai la so khong am\" % (name, i))\n        in_range(name, i, r)\n\n    # sources.csv\n    name =\
        \ \"sources.csv\"\n    rows = table(name)\n    need(name, rows, [\"id\", \"claim\"])\n    for i, r in enumerate(rows,\
        \ 2):\n        if str(r.get(\"evidence_type\") or \"\").strip() not in SOURCE_TYPES:\n            issues.append(\"\
        %s dong %d: evidence_type khong hop le\" % (name, i))\n\n    if read_json(\"audience_segments.json\") is None:\n \
        \       issues.append(\"audience_segments.json: khong phai JSON hop le\")\n\n    if issues:\n        return out(\"\
        ISSUES\")\n\n    hashes = {n: hashlib.sha256((A / n).read_bytes()).hexdigest() for n in REVIEW_SET}\n    ver = hashlib.sha256(\"\
        \\n\".join(\"%s:%s\" % (n, hashes[n]) for n in sorted(hashes)).encode()).hexdigest()[:12]\n    R.mkdir(exist_ok=True)\n\
        \    snapshot = R / ver\n    snapshot.mkdir(exist_ok=True)\n    for n, digest in hashes.items():\n        dest = snapshot\
        \ / n\n        if dest.exists() and hashlib.sha256(dest.read_bytes()).hexdigest() != digest:\n            raise ValueError(\"\
        review snapshot collision: \" + n)\n        if not dest.exists():\n            shutil.copyfile(A / n, dest)\n    \
        \    if hashlib.sha256(dest.read_bytes()).hexdigest() != digest:\n            raise ValueError(\"source changed while\
        \ snapshotting: \" + n)\n    (R / \"review_manifest.json\").write_text(json.dumps(\n        {\"plan_version\": ver,\
        \ \"created_at\": datetime.datetime.now().isoformat(timespec=\"seconds\"), \"files\": hashes},\n        ensure_ascii=False,\
        \ indent=2), encoding=\"utf-8\")\n    return out(\"OK\", plan_version=ver)\n\n\ntry:\n    main()\nexcept Exception\
        \ as e:\n    errors.append(\"loi script: %s: %s\" % (type(e).__name__, e))\n    out(\"ERROR\")\n```"
  - id: Plan_Gate
    type: python
    config:
      timeout_seconds: 60
      env:
        PYTHONIOENCODING: utf-8
        PYTHONUTF8: '1'
  - id: Plan_Router
    type: passthrough
    config:
      only_last_message: true
  - id: Strategy_QA
    type: agent
    config:
      provider: openai
      base_url: ${BASE_URL}
      api_key: ${API_KEY}
      name: ${MODEL_REVIEW}
      params:
        temperature: 0.1
        protocol: chat
      role: 'Agent Skill cho nhiệm vụ này: ad-strategy-quality-review. Trước khi bắt đầu chuyên môn, gọi activate_skill với
        skill_name này. Chỉ kích hoạt một lần trong lượt chạy node; nếu kích hoạt thất bại hãy báo rõ, không khẳng định đã
        dùng skill.


        Bạn là Strategy Reviewer độc lập, giai đoạn KIỂM TRA CUỐI. Bạn nhận bản nháp kế hoạch, brief, chiến lược và kết quả
        của Plan_Gate (JSON có status và plan_version).

        Kiểm tra:

        1. Kế hoạch có đáp ứng brief và yêu cầu gốc không.

        2. Nhận định quan trọng có nguồn hoặc được đánh dấu giả định không.

        3. Ngân sách có cộng đúng và nằm trong giới hạn không (dựa vào Plan_Gate, không tự cộng nhẩm).

        4. Dự báo có công thức, đơn vị và giả định rõ không.

        5. Audience, offer, creative và media có khớp ID với strategy_ids.json không.

        6. KPI có đo được bằng tracking đã đề xuất không.

        7. Claim quảng cáo có bằng chứng; phần chưa kiểm chứng có được nêu rõ không.

        8. Đủ file bàn giao thật và nhất quán giữa mọi tài liệu nguồn, bản tổng hợp và bảng; không coi một receipt ĐÃ NHẬN
        là bằng chứng đủ chất lượng.

        Chỉ được lưu file qa_report.json; tuyệt đối không ghi đè file nào khác.

        Chỉ chọn REVISE khi lỗi ảnh hưởng thật sự tới chất lượng và có thể sửa ở bước tổng hợp.

        Chọn BLOCKED khi thiếu thông tin quyết định không thể bù bằng giả định, hoặc bản nháp ghi "CẦN LẬP LẠI TỪ BRIEF" (giải
        thích lý do).

        Chat chỉ tóm tắt kết quả; quyết định định tuyến được code lấy từ verdict trong qa_report.json đã kiểm tra.


        QUY TẮC CHUNG (áp dụng cho mọi node):

        1. Viết bằng tiếng Việt.

        2. Mỗi nhận định quan trọng gắn một nhãn: [TÀI LIỆU] (từ tài liệu người dùng), [NGUỒN NGOÀI] (kèm URL và ngày truy
        cập), [SUY LUẬN] hoặc [GIẢ THUYẾT] (cần thử nghiệm).

        3. Không bịa CPC, CPA, doanh thu đối thủ hoặc kết quả chiến dịch. Chưa có dữ liệu thì ghi GIẢ ĐỊNH kèm công thức,
        đơn vị và cơ sở.

        4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.

        5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).

        6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè
        file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).

        7. QA ghi quyết định trong qa_report.json; code phát trạng thái điều phối sau khi kiểm tra. Chat không cần dòng quyết
        định.

        8. Lưu và đọc lại file bằng tool; Chat tóm tắt file/giới hạn, node sau đọc artifact hiện hành bằng load_file thay
        vì nhận toàn bộ file dán lại.



        OUTPUT CONTRACT: Save every required artifact before finishing. Re-open each saved file using load_file to verify
        it. Do not claim a missing file was saved. Use plain canonical numbers (dot decimal; no comma separators or percent
        symbols) in numeric JSON/CSV fields. Preserve the original user request, including an explicit no-web restriction;
        in that mode use supplied documents or clearly labelled hypotheses and never invent URLs.


        REVIEW XUYÊN SUỐT HỒ SƠ:

        - Không PASS chỉ vì bản tổng hợp đã sửa đẹp. Đọc brief, sources/digest, market_research, competitor_analysis, audience/customer
        journey, brand_positioning, campaign_strategy/registry và ba nhánh kế hoạch hiện hành. Đối chiếu claim giá/sức chi
        trả, tiện ích/chất lượng, so sánh đối thủ, offer, ID, tiền, KPI và lịch giữa các file liên quan.

        - Nhận định sai nhãn bằng chứng hoặc claim chưa có căn cứ còn nằm trong tài liệu nguồn là issue của bộ giao, kể cả
        bản tổng hợp đã bỏ. Nêu rõ file/đoạn hoặc dòng CSV, claim/source ID nếu có, kết luận mâu thuẫn và sửa ở đâu trong
        schema issues hiện có; giữ cấu trúc báo cáo QA 2.0 bên dưới.

        - Kiểm bản kế hoạch sạch và đúng tên file giao; đọc internal/assembly_notes.md nếu có để biết phần chưa xử lý, nhưng
        không dùng ghi chú này thay nguồn được review/snapshot. Ghi chú không có không phải bằng chứng đủ/thiếu bàn giao:
        kiểm các file thật.

        - Phân biệt giới hạn/giả thuyết trung thực với lỗi claim khẳng định sai. Không yêu cầu bịa dữ liệu để đạt PASS. Nếu
        sửa được trong quyền Assembler thì REVISE; nếu cần chủ nguồn/đầu vào mới ngoài quyền sửa thì giải thích cần dừng,
        không cho PASS chỉ để kết thúc vòng.


        BẰNG CHỨNG: Brief giả định không phải xác minh thực địa. Giữ nhãn nguồn/phạm vi, claim ID và điều chưa được chứng
        minh; không biến suy luận về giá, tiện ích hoặc đối thủ thành dữ kiện. Theo skill vai trò để đối chiếu claim. Trong
        tài liệu giao dùng tên file tương đối; tool vẫn dùng artifacts/.

        BÁO CÁO QA V2:

        schema_version="2.0"; giữ plan_version/verdict/plan_gate_status/issues và thêm review_summary, criteria_results, open_assumptions,
        prelaunch_conditions, implementation_readiness. Kích hoạt ad-strategy-quality-review để lấy schema, đủ 8 tiêu chí
        và 5 điều kiện với evidence_refs file/vị trí trong snapshot. PASS chỉ khi tiêu chí đạt và không còn issue; chưa PASS
        hoặc có điều kiện BLOCKED → NOT_READY; PASS còn PENDING → CONDITIONAL; mọi điều kiện VERIFIED/NOT_APPLICABLE có căn
        cứ mới READY. Báo cáo cần chỉ rõ hạn chế, owner và việc phải làm. Không bịa xác minh thực địa; chất lượng kế hoạch
        khác mức sẵn sàng chạy. Chat tóm tắt kết luận, không dán lại JSON; giữ đúng dòng QA cuối.


        VIẾT GỌN: JSON 2.0 đủ mọi tiêu chí và điều kiện; Chat chỉ kết luận. Mốc tham khảo, không cắt schema/căn cứ/điều kiện.
        Chat khoảng 6–10 dòng kết quả, file và giới hạn; không dán lại file/JSON. Giữ câu hỏi, issue và dòng quyết định cuối.
        Đọc artifact hiện hành bằng load_file, tái sử dụng kết quả trong lượt; đọc lại sau lần ghi cuối hoặc khi nguồn thay
        đổi.


        Quyết định QA chính thức chỉ lấy từ verdict trong artifacts/qa_report.json. Lưu báo cáo đầy đủ và đúng plan_version;
        chat chỉ tóm tắt, không cần dòng trạng thái hay token điều phối. Code kiểm schema, phiên bản và hash trước khi phát
        quyết định; không coi lời tự xác nhận là PASS.


        QA JSON: severity chỉ dùng high, medium hoặc low (chữ thường), không dùng CRITICAL/MAJOR/MINOR. Mỗi issue cần id,
        severity, area, description, fix, owner, evidence_refs. evidence_refs.file phải là tên file có trong review_manifest.files,
        không phải review/review_manifest.json, qa_report.json hay đường dẫn workspace; location bắt buộc. Nếu save_file báo
        lỗi schema, sửa trường được chỉ ra rồi lưu lại trong cùng lượt; giữ nguyên ý nghĩa phát hiện và verdict, không xóa
        issue để lấy PASS. Code cho tối đa hai lần sửa báo cáo bị từ chối. Quyết định định tuyến chỉ do code lấy từ báo cáo
        đã kiểm, chat không cần dòng trạng thái.'
      tooling:
      - type: function
        config:
          tools:
          - name: load_file
          - name: list_directory
          - name: save_file
          timeout: null
        prefix: ''
      retry:
        enabled: true
        max_attempts: 2
        min_wait_seconds: 1
        max_wait_seconds: 3
        non_retry_exception_types:
        - ProviderResponseError
      skills:
        enabled: true
        allow:
        - ad-strategy-quality-review
  - id: Client_Review
    type: human
    config:
      description: 'Nhập đúng HUMAN: APPROVE để duyệt kế hoạch và ủy quyền hoàn thiện toàn bộ bài đăng, kịch bản, banner và
        bộ file cuối theo kế hoạch này; workflow không hỏi duyệt lần hai. Nội dung vẫn phải qua kiểm tra cấu trúc/phiên bản,
        không bịa thông tin chưa xác nhận. Không tự đăng bài hoặc chi tiền quảng cáo. Nếu cần sửa kế hoạch, nhập HUMAN: REVISE
