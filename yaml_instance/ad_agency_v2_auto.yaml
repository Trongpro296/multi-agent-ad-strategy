        \ < 0:\n        errors.append(\"brief: budget.ad_spend thieu hoac khong hop le\")\n    if not d0 or not d1 or d0 >\
        \ d1:\n        errors.append(\"brief: start_date/end_date thieu hoac khong hop le\")\n    if not cur:\n        errors.append(\"\
        brief: budget.currency thieu\")\n    if not segs:\n        errors.append(\"strategy_ids.json: khong co segments hop\
        \ le\")\n    if not offs:\n        errors.append(\"strategy_ids.json: khong co offers hop le\")\n    if errors:\n\
        \        return out(\"ERROR\")\n    info[\"ad_spend\"] = cap\n\n    def table(name):\n        cols, rows = read_csv(name)\n\
        \        if cols is None:\n            issues.append(name + \": khong doc duoc dinh dang CSV\")\n            return\
        \ []\n        miss = [c for c in CSV_COLS[name] if c not in cols]\n        if len(cols) != len(set(cols)) or any(None\
        \ in r or any(v is None for v in r.values()) for r in rows):\n            issues.append(name + \": duplicate columns\
        \ or malformed row width\")\n            return []\n        if miss:\n            issues.append(name + \": thieu cot\
        \ \" + str(miss))\n            return []\n        if not rows:\n            issues.append(name + \": khong co dong\
        \ du lieu\")\n            return []\n        return rows\n\n    def need(name, rows, fields):\n        for i, r in\
        \ enumerate(rows, 2):\n            for f in fields:\n                if not str(r.get(f) or \"\").strip():\n     \
        \               issues.append(\"%s dong %d: thieu %s\" % (name, i, f))\n\n    def in_range(name, i, r):\n        s,\
        \ e = day(r.get(\"start\")), day(r.get(\"end\"))\n        if not s or not e:\n            issues.append(\"%s dong\
        \ %d: ngay khong hop le\" % (name, i))\n        elif s > e:\n            issues.append(\"%s dong %d: start sau end\"\
        \ % (name, i))\n        elif s < d0 or e > d1:\n            issues.append(\"%s dong %d: ngoai thoi gian chien dich\"\
        \ % (name, i))\n\n    def check_ids(name, i, r, field, valid):\n        got = ids_of(r.get(field))\n        if not\
        \ got:\n            issues.append(\"%s dong %d: %s de trong\" % (name, i, field))\n        for g in got:\n       \
        \     if g not in valid:\n                issues.append(\"%s dong %d: %s '%s' khong co trong strategy_ids.json\" %\
        \ (name, i, field, g))\n\n    # media_plan.csv\n    name = \"media_plan.csv\"\n    rows = table(name)\n    need(name,\
