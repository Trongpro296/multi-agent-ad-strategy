        %s dong %d: currency khac brief (%s)\" % (name, i, cur))\n        in_range(name, i, r)\n        check_ids(name, i,\
        \ r, \"segment_id\", segs)\n        check_ids(name, i, r, \"offer_id\", offs)\n    if rows:\n        info[\"tong_budget_pct\"\
        ], info[\"tong_budget_amount\"] = round(tp, 2), round(ta, 2)\n        if cap > 0:\n            if abs(tp - 100) >\
        \ Decimal(\"0.5\"):\n                issues.append(\"%s: tong budget_pct = %s, phai bang 100\" % (name, round(tp,\
        \ 2)))\n            if ta > cap:\n                issues.append(\"%s: tong budget_amount %s vuot ad_spend %s\" % (name,\
        \ round(ta, 2), cap))\n            elif abs(ta - cap) / cap > Decimal(\"0.02\"):\n                issues.append(\"\
        %s: tong budget_amount %s lech hon 2%% so voi ad_spend %s\" % (name, round(ta, 2), cap))\n        elif ta > 0:\n \
        \           issues.append(\"%s: ad_spend = 0 nhung co budget_amount > 0\" % name)\n\n    # budget_scenarios.csv\n\
        \    name = \"budget_scenarios.csv\"\n    rows = table(name)\n    need(name, rows, [\"scenario\", \"channel\", \"\
