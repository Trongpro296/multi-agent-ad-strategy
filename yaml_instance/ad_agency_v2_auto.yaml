  - id: Brief_Clarification
    type: literal
    config:
      role: user
      content: Không có thêm thông tin từ người dùng. Hãy dùng giả định hợp lý cho mọi thông tin còn thiếu, ghi rõ trong assumptions
        và kết thúc brief ở trạng thái READY.
