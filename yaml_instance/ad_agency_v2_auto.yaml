        \n    brief, ids = read_json(\"campaign_brief.json\"), read_json(\"strategy_ids.json\")\n    b = brief.get(\"budget\"\
        ) if isinstance(brief, dict) else None\n    cap = num(b.get(\"ad_spend\")) if isinstance(b, dict) else None\n    d0\
        \ = day(brief.get(\"start_date\")) if isinstance(brief, dict) else None\n    d1 = day(brief.get(\"end_date\")) if\
        \ isinstance(brief, dict) else None\n    cur = str(b.get(\"currency\") or \"\").strip() if isinstance(b, dict) else\
        \ \"\"\n    segs, offs = set(), set()\n    if isinstance(ids, dict):\n        segs = {s.get(\"segment_id\") for s\
