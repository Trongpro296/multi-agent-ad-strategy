        Tạo EVIDENCE DIGEST gồm:

        0) BÁO CÁO NHẬN ĐƯỢC: với Market, Competitor, Customer ghi một trạng thái: ĐÃ NHẬN | THIẾU | KHÔNG HỢP LỆ (kèm lý
        do ngắn). Báo cáo trống, cụt hoặc không đúng vai trò là KHÔNG HỢP LỆ.

        A) Dữ kiện đã có nguồn (tóm tắt, giữ nguồn); với mỗi nguồn ghi rõ ĐÃ ĐỌC (có nội dung truy cập được) hay CHƯA XÁC
        MINH.

        B) Giả định hoặc giả thuyết chưa có bằng chứng.

        C) Mâu thuẫn giữa các báo cáo.

        D) Khoảng trống dữ liệu cần lưu ý cho giai đoạn chiến lược.

        Không viết lại báo cáo, không bịa nguồn. Nếu không có công cụ truy cập URL, ghi "chưa xác minh truy cập" thay vì khẳng
        định nguồn đúng.

        Lưu artifacts/evidence_digest.md và artifacts/sources.csv với cột: id,claim,source_url,access_date,scope,evidence_type
        (document|external|inference|hypothesis). Nếu không có nguồn nào, ghi ít nhất một dòng evidence_type=hypothesis mô
        tả giới hạn dữ liệu.

        Node này không có dòng quyết định điều phối.


        QUY TẮC CHUNG (áp dụng cho mọi node):

        1. Viết bằng tiếng Việt.

