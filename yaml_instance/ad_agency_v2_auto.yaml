        plan_version trong manifest khong khop hash cac file\")\n    for n in REVIEW_SET:\n        snapshot = R / ver / n\n\
        \        if not snapshot.is_file() or files.get(n) != sha(snapshot):\n            problems.append(\"missing or changed\
        \ review snapshot: \" + n)\n    try:\n        qa = json.loads((A / \"qa_report.json\").read_text(encoding=\"utf-8-sig\"\
        ))\n        problems.extend(qa_report_issues(qa, man.get(\"plan_version\"), REVIEW_SET))\n        if qa.get(\"verdict\"\
        ) != \"PASS\":\n            problems.append(\"qa_report.json: verdict khong phai PASS\")\n        if qa.get(\"plan_version\"\
        ) != man.get(\"plan_version\"):\n            problems.append(\"qa_report.json: plan_version khac manifest (QA %s,\
        \ manifest %s)\" %\n                            (qa.get(\"plan_version\"), man.get(\"plan_version\")))\n    except\
        \ Exception as e:\n        problems.append(\"khong doc duoc qa_report.json: %s\" % e)\n    hn = A / \"handoff_notes.md\"\
        \n    if not hn.is_file() or hn.stat().st_size == 0:\n        problems.append(\"thieu hoac rong: handoff_notes.md\"\
        )\n    return man, files, problems\n\n\ndef build(man, files):\n    from openpyxl import Workbook\n    from pptx import\
        \ Presentation\n    if TMP.exists():\n        shutil.rmtree(TMP)\n    TMP.mkdir()\n    delivered = []\n    for n in\
        \ REVIEW_SET + EXTRA:\n        dst = RENAME.get(n, n)\n        source = R / man[\"plan_version\"] / n if n in REVIEW_SET\
        \ else A / n\n        shutil.copyfile(source, TMP / dst)\n        if n in files and sha(TMP / dst) != files[n]:\n\
        \            raise ValueError(\"source changed while copying: \" + n)\n        delivered.append({\"name\": dst, \"\
        source\": n, \"sha256\": sha(TMP / dst)})\n\n    copied_qa = json.loads((TMP / \"qa_report.json\").read_text(encoding=\"\
        utf-8-sig\"))\n    qa_problems = qa_report_issues(copied_qa, man[\"plan_version\"], REVIEW_SET)\n    if qa_problems\
        \ or copied_qa.get(\"verdict\") != \"PASS\":\n        raise ValueError(\"Copied QA report is invalid or changed before\
        \ packaging: \" + \"; \".join(qa_problems))\n\n    wb = Workbook()\n    wb.remove(wb.active)\n    for sheet, fn in\
        \ SHEETS:\n        ws = wb.create_sheet(sheet)\n        with (TMP / fn).open(encoding=\"utf-8-sig\", newline=\"\"\
        ) as f:\n            rd = csv.reader(f)\n            header = next(rd, [])\n            ws.append(header)\n      \
        \      num_cols = {i for i, h in enumerate(header) if h in NUMERIC.get(fn, set())}\n            for row in rd:\n \
        \               values = dict(zip(header, row))\n                unestimated = fn == \"budget_scenarios.csv\" and\
        \ values.get(\"estimate_status\", \"\").strip() == \"NOT_ESTIMATED\"\n                if unestimated and values.get(\"\
        metric_value\", \"\").strip():\n                    raise ValueError(\"NOT_ESTIMATED requires an empty metric_value\"\
        )\n                ws.append([None if unestimated and header[i] == \"metric_value\" else typed(v) if i in num_cols\
        \ else v for i, v in enumerate(row)])\n    wb.save(TMP / \"Campaign_Plan.xlsx\")\n\n    generated = build_delivery_assets(TMP,\
        \ copied_qa, man[\"plan_version\"])\n    import os\n    if os.environ.get('AD_PUBLICATION_REQUIRED') != '1':\n   \
        \     generated += attach_banner_assets(pathlib.Path.cwd(), TMP, man[\"plan_version\"])\n\n    import os\n    if os.environ.get('AD_PUBLICATION_REQUIRED')\
        \ == '1':\n        from utils.ad_publication import finalize_delivery\n        exported = finalize_delivery(pathlib.Path.cwd(),\
        \ TMP, man['plan_version'], os.environ.get('AD_PUBLICATION_APPROVAL_SHA256'))\n        for item in delivered:\n  \
        \          item['name'] = 'internal/' + item['name']\n        generated = ['internal/' + name for name in generated]\n\
        \        known = {item['name'] for item in delivered} | set(generated)\n        generated += [name for name in exported\
        \ if name not in known]\n\n    manifest = {\"plan_version\": man[\"plan_version\"], \"approved_sources\": files,\n\
        \                \"qa_schema_version\": copied_qa[\"schema_version\"],\n                \"qa_verdict\": copied_qa[\"\
        verdict\"],\n                \"implementation_readiness\": copied_qa[\"implementation_readiness\"],\n            \
        \    \"prelaunch_conditions\": copied_qa[\"prelaunch_conditions\"],\n                \"operating_templates\": {\"\
        visit_log_template.csv\": \"blank input template\", \"daily_report_template.csv\": \"blank input template\", \"prelaunch_checklist.csv\"\
        : \"QA conditions, not performed by export\"},\n                \"delivered_files\": delivered,\n                \"\
        generated_files\": [{\"name\": g, \"sha256\": sha(TMP / g)}\n                                    for g in generated],\n\
        \                \"built_at\": datetime.datetime.now().isoformat(timespec=\"seconds\")}\n    (TMP / \"manifest.json\"\
        ).write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding=\"utf-8\")\n    if OUT.exists():\n     \
        \   shutil.rmtree(OUT)\n    TMP.rename(OUT)\n    return sorted(p.name for p in OUT.iterdir())\n\n\ntry:\n    man,\
        \ files, problems = verify()\n    if problems:\n        finish(\"BLOCKED\", problems)\n    else:\n        listing\
        \ = build(man, files)\n        finish(\"OK\", [], plan_version=man[\"plan_version\"], output_dir=str(OUT), files=listing)\n\
        except Exception as e:\n    if TMP.exists():\n        shutil.rmtree(TMP, ignore_errors=True)\n    finish(\"ERROR\"\
        , [\"%s: %s\" % (type(e).__name__, e)])\n```"
