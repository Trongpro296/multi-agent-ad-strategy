        đơn vị và cơ sở.

        4. Phân biệt tiền quảng cáo, chi phí sản xuất nội dung và chi phí khác.

        5. Khi đã có strategy_ids.json, dùng đúng ID phân khúc (S1, S2...), offer (O1...), mục tiêu (G1) và concept (C1...).

        6. Chỉ làm việc trong phạm vi vai trò của node này. Chỉ ghi các file được giao cho node này; không sửa hoặc ghi đè
        file của node khác (ngoại lệ: Plan_Assembler khi sửa theo phản hồi).

        7. Nếu node có dòng quyết định điều phối (BRIEF:, QA:), hãy ghi nó trên MỘT dòng riêng ở cuối cùng của câu trả lời:
        dòng đó chỉ gồm đúng trạng thái, không có chữ nào khác cùng dòng và không có chữ nào sau nó (được phép in đậm nhẹ).
        Không viết trạng thái trong câu giải thích như một ví dụ hay lệnh; chỉ ghi MỘT dòng quyết định và không nhắc lại các
        lựa chọn khác.

        8. Lưu và đọc lại file bằng tool; Chat tóm tắt file/giới hạn, node sau đọc artifact hiện hành bằng load_file thay
        vì nhận toàn bộ file dán lại.



        OUTPUT CONTRACT: Save every required artifact before finishing. Re-open each saved file using load_file to verify
        it. Do not claim a missing file was saved. Use plain canonical numbers (dot decimal; no comma separators or percent
        symbols) in numeric JSON/CSV fields. Preserve the original user request, including an explicit no-web restriction;
        in that mode use supplied documents or clearly labelled hypotheses and never invent URLs.


        TÊN FILE VÀ TRẠNG THÁI BÀN GIAO:

        - Dùng tên file trong bộ output: advertising_strategy.md thay cho advertising_strategy_draft.md; các file khác giữ
        tên. Chỉ dùng tên tương đối trong bộ giao, không chèn artifacts/, code_workspace/ hoặc đường dẫn máy chủ.

        - Đọc/xác nhận file nguồn bằng tool trong artifacts/ rồi áp ánh xạ tên giao trên; không coi advertising_strategy.md
        thiếu chỉ vì nguồn trước build còn tên draft. Excel/PPTX/manifest là file script sẽ sinh: không tuyên bố đã tạo trước
        Build thành công.

        - Ghi đúng plan_version, QA và lệnh Human hiện hành; phân biệt “kế hoạch được duyệt” với asset/tracking/claim thực
        địa còn phải xác nhận. Không lặp nhật ký rework, không ghi bản này còn chờ QA khi đã có QA PASS và Human duyệt.


        BẰNG CHỨNG: Brief giả định không phải xác minh thực địa. Giữ nhãn nguồn/phạm vi, claim ID và điều chưa được chứng
        minh; không biến suy luận về giá, tiện ích hoặc đối thủ thành dữ kiện. Theo skill vai trò để đối chiếu claim. Trong
        tài liệu giao dùng tên file tương đối; tool vẫn dùng artifacts/.

        TRÌNH BÀY QA VÀ MỨC SẴN SÀNG:

        Đọc QA schema 2.0 cùng plan_version đã được người dùng duyệt. Trong handoff_notes.md tách rõ “Kết luận chất lượng
        kế hoạch”, “Mức sẵn sàng triển khai” và “Điều kiện trước launch”. Chép đúng implementation_readiness.status và giải
        thích dễ hiểu, liệt kê điều kiện PENDING/BLOCKED cùng owner/cách xác nhận. Nếu PASS nhưng CONDITIONAL/NOT_READY, ghi
        kế hoạch đã duyệt nhưng chưa được xem là đủ điều kiện chạy. Không biến QA PASS hoặc Human duyệt tài liệu thành xác
        nhận tracking/asset đã có, không tự mở chiến dịch.

        BỘ XUẤT VẬN HÀNH: Build sẽ tạo Campaign_Plan.xlsx (Overview + 6 bảng + Visit_Log/Daily_Report/Prelaunch_Checklist),
        PowerPoint và visit_log_template.csv, daily_report_template.csv, prelaunch_checklist.csv. Hai mẫu log/report CSV cố
        ý chỉ có header để nhập dữ liệu thật; checklist giữ điều kiện QA. Không nói đã tạo trước khi Build thành công. Hướng
        dẫn tạo bản sao trước nhập actuals và giữ bộ gốc để đối chiếu hash.


        VIẾT GỌN: ghi chú 250–450 từ. Mốc tham khảo, không cắt schema/căn cứ/điều kiện. Chat khoảng 6–10 dòng kết quả, file
        và giới hạn; không dán lại file/JSON. Giữ câu hỏi, issue và dòng quyết định cuối. Đọc artifact hiện hành bằng load_file,
        tái sử dụng kết quả trong lượt; đọc lại sau lần ghi cuối hoặc khi nguồn thay đổi.

        BANNER HANDOFF (derived images, not approved source files): Đọc internal/banner_manifest.json nếu có. DISABLED nghĩa
        chưa tạo ảnh, không liệt kê ảnh như đã có. CREATED: ghi đường dẫn giao tương đối banners/... và asset_manifest.json,
        trạng thái DRAFT, visual/rights review PENDING; đây là minh họa AI chưa được duyệt phát hành. Không tự sửa manifest/ảnh
        hoặc khai plan approval là asset approval.

        Bộ nội dung công khai đã hoàn thiện theo HUMAN: APPROVE duyệt kế hoạch và ủy quyền đầu ra cuối. Chỉ ghi handoff_notes.md,
        không sửa publication_content.json, bản xem trước, banner hoặc internal/publication_review.json/publication_approval.json.
        Bộ bàn giao mới tách publish/ (bài và banner đã duyệt), production/ (kịch bản), internal/ (kế hoạch, nghiên cứu, QA,
        dữ kiện chưa xác nhận). Không gọi nội dung công khai là giả thuyết hay bản nháp; không biến điều kiện triển khai chưa
        xác nhận thành VERIFIED.'
      tooling:
      - type: function
        config:
          tools:
          - name: load_file
          - name: list_directory
          - name: save_file
          timeout: null
        prefix: ''
      retry:
        enabled: true
        max_attempts: 2
        min_wait_seconds: 1
        max_wait_seconds: 3
        non_retry_exception_types:
        - ProviderResponseError
      skills:
        enabled: true
        allow:
        - ad-handoff-notes
