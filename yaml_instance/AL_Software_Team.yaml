      dynamic: null
    - from: Frontend
      to: Tester
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Tester
      to: PM
      trigger: true
      condition: null
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Need_Input
      to: PM
      trigger: true
      condition: null
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: PM
      to: Need_Input
      trigger: true
      condition:
        type: keyword
        config:
          any:
            - BLOCKED
          none: []
          regex: []
          case_sensitive: true
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: PM
      to: Delivery
      trigger: true
      condition:
        type: keyword
        config:
          any:
            - APPROVED
          none: []
          regex: []
          case_sensitive: true
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: PM
      to: Designer
      trigger: true
      condition:
